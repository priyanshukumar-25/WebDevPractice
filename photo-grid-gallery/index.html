<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Notes — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Feild Notes</h1>
        <p>A small photo log. Replace each title's background with a real photo whe  you have one. </p>
    </header>

    <main class="gallery">


        
  <figure class="tile tile-tall" style="--c1:#ff9a5a; --c2:#c2472b;">
            <figcaption>
                <span class="loc">Ladakh, June</span>
                <span class="cap">Morning light over the pass</span>
            </figcaption>
        </figure>

        <figure class="tile" style="--c1:#7fd1c9; --c2:#1f6f73;">
            <figcaption>
                <span class="loc">Keral, March</span>
                <span class="cap">Backwaters at low tide</span>
            </figcaption>
        </figure>

        <figure class="tile" style="--c1:#f7c948; --c2:#c97a1a;">
            <figcaption>
                <span class="loc">Jaipur, Nov</span>
                <span class="cap">A wall of marigolds</span>
            </figcaption>
        </figure>

        <figure class=" tile tile-wide" style="--c1:#8d9aff; --c2:#3a3f9e;">
            <figcaption>
                <span class="loc">Goa, Jan </span>
                <span class="cap">Fishing boats, first light </span>
            </figcaption>
        </figure>

        <figure class=" tile tile-tall" style="--c1:#9fd66b; --c2:#3e7a2f;">
             <figcaption>
                <span class="loc">Meghalya, Aug </span>
                <span class="cap">Root bridge, after the rain </span>
            </figcaption>
        </figure>

        <figure class="tile"  style="--c1:#c9a7ff; --c2:#5c3aa3;">
            <figcaption>
                <span class="loc">Delhi, Oct </span>
                <span class="cap">Kite strings at dusk </span>
            </figcaption>
        </figure>

        <figure class="tile" style="--c1:#ffb385; --c2:#a44a1f;">
            <figcaption>
                <span class="loc">Rann of Kutch, Dec</span>
                <span class="cap">Salt flat, full moon </span>
            </figcaption>
        </figure>
    </main>

    <footer>
        <p>Feild Notes - a static gallery template, built with css grid only.</p>
    </footer>

</body>
</html>
